openapi: 3.1.0
info:
  title: MiniInvest invest-core API
  version: 1.0.0
  summary: API of invest-core for the MiniInvest Android app.
  description: |
    API of invest-core, the core service of MiniInvest: placing ETF orders, order status and
    history, the portfolio and the instrument offer of the user's market.

    ## Conventions

    - **Identity.** The user, their account and their market come from the access token.
      No request carries a user ID, an account ID, a market or a price.
    - **Money.** Every amount is a `Money` object: a decimal number as a string and an
      ISO 4217 currency code. Money is never a JSON number and never comes without a currency.
    - **Quantities.** Quantities are decimal strings, so fractional shares need no special
      format. Each instrument states its `minQuantity` and `quantityStep`; a step of `1` means
      whole units only.
    - **Markets.** The market (CZ, SK, ...) is a property of the account. Adding a market
      changes data and configuration on the server, not this contract.
    - **Language.** `Accept-Language` (BCP 47) only selects the language of texts the server
      sends, such as instrument names and `Problem.detail`. It never changes business logic.
    - **Time.** Timestamps are RFC 3339 date-times in UTC, for example `2026-10-31T22:27:00Z`.
    - **Missing values.** Response fields are always present; a field without a value is
      `null`. The only exception is `Problem`, which follows RFC 9457 and omits empty members.
    - **Errors.** Every error is `application/problem+json` (RFC 9457) with a stable `code`.
      Clients decide by `code`, never by `detail`.

    ## Compatibility

    Within `/api/v1` the contract only changes additively. Clients must:

    - ignore response fields they do not know,
    - treat values marked as *extensible* (order status, order side, rejection codes, error
      codes, market codes) as open sets and handle unknown values with a fallback,
    - never parse `Problem.detail` or the pagination cursor.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: http://localhost:8080
    description: Local Docker Compose

security:
  - bearerAuth: []

tags:
  - name: Orders
    description: Placing orders, order status and order history.
  - name: Portfolio
    description: Cash and positions of the signed-in user.
  - name: Instruments
    description: Instruments offered in the user's market.

paths:
  /api/v1/orders:
    post:
      tags: [Orders]
      operationId: placeOrder
      summary: Place a buy order
      description: |
        Accepts a market order to buy an ETF by quantity, which may be fractional. The quantity
        must be at least the instrument's `minQuantity` and a multiple of its `quantityStep`.
        Execution is asynchronous: the response is `202 Accepted` with the order in status
        `PENDING`, and the final state is read from the URL in `Location`.

        The price comes from the server's own source. An estimated amount (price × quantity
        plus a buffer) is reserved from the available cash; the actual cost is settled after
        execution.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
            example:
              isin: IE00B4L5Y983
              side: BUY
              quantity: '2.5'
      responses:
        '202':
          description: Order accepted; execution is pending.
          headers:
            Location:
              description: URL of the order resource.
              required: true
              schema:
                type: string
                format: uri-reference
              example: /api/v1/orders/d3b07384-9a1f-4c1e-8f7a-2b4c6e8d0a11
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
              example:
                orderId: d3b07384-9a1f-4c1e-8f7a-2b4c6e8d0a11
                side: BUY
                isin: IE00B4L5Y983
                quantity: '2.5'
                status: PENDING
                reservedAmount:
                  amount: '1330.00'
                  currency: CZK
                executionPrice: null
                rejectionCode: null
                createdAt: '2026-10-31T22:27:00Z'
                updatedAt: '2026-10-31T22:27:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableContent'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List the order history
      description: |
        Orders of the signed-in user, newest first, paginated with a cursor. To get the next
        page, send `nextCursor` from the previous response as `cursor` with the same `status`
        filter. Changing the filter starts again from the first page.
      parameters:
        - name: status
          in: query
          required: false
          description: Return only orders in this status.
          schema:
            $ref: '#/components/schemas/OrderStatus'
        - name: limit
          in: query
          required: false
          description: Maximum number of orders on the page.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          description: Opaque cursor from `nextCursor` of the previous page. Omit it for the first page.
          schema:
            type: string
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: One page of orders.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
              example:
                items:
                  - orderId: d3b07384-9a1f-4c1e-8f7a-2b4c6e8d0a11
                    side: BUY
                    isin: IE00B4L5Y983
                    quantity: '5'
                    status: EXECUTED
                    reservedAmount:
                      amount: '2650.00'
                      currency: CZK
                    executionPrice:
                      amount: '521.40'
                      currency: CZK
                    rejectionCode: null
                    createdAt: '2026-10-30T09:15:00Z'
                    updatedAt: '2026-10-30T09:15:07Z'
                nextCursor: eyJjcmVhdGVkQXQiOiIyMDI2LTEwLTMwVDA5OjE1OjAwWiIsImlkIjoiZDNiMDczODQtOWExZi00YzFlLThmN2EtMmI0YzZlOGQwYTExIn0
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get an order
      description: |
        Current state of one order. The app reads it when a push notification arrives and when
        the order screen opens; push is not guaranteed, so this endpoint is the source of truth.
      parameters:
        - name: orderId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/portfolio:
    get:
      tags: [Portfolio]
      operationId: getPortfolio
      summary: Get the portfolio
      description: Cash and positions of the signed-in user's account.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: The portfolio.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Portfolio'
              example:
                market: CZ
                currency: CZK
                cash:
                  total:
                    amount: '50000.00'
                    currency: CZK
                  reserved:
                    amount: '2650.00'
                    currency: CZK
                  available:
                    amount: '47350.00'
                    currency: CZK
                positions:
                  - isin: IE00B4L5Y983
                    name: iShares Core MSCI World UCITS ETF
                    quantity: '12.5'
                    averagePrice:
                      amount: '498.20'
                      currency: CZK
                    marketValue:
                      amount: '6517.50'
                      currency: CZK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/v1/instruments:
    get:
      tags: [Instruments]
      operationId: listInstruments
      summary: List instruments offered in the user's market
      description: |
        The offer depends on the market of the signed-in user's account. Another market returns
        a different offer in the same shape.
      parameters:
        - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Instruments with their current prices.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstrumentList'
              example:
                items:
                  - isin: IE00B4L5Y983
                    name: iShares Core MSCI World UCITS ETF
                    minQuantity: '0.0001'
                    quantityStep: '0.0001'
                    price:
                      amount: '521.40'
                      currency: CZK
                    priceTime: '2026-10-31T22:26:58Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by Keycloak.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        Identifies one purchase intent. The app generates a UUID when the user confirms the
        purchase and sends the same key with every retry of that purchase. A new purchase, even
        of the same instrument and quantity, gets a new key.

        Keys are scoped to the user and stored with a fingerprint of the request body and the
        response, in the same transaction as the order.

        | Situation | Response |
        | --- | --- |
        | Key missing or not a UUID | `400`, code `IDEMPOTENCY_KEY_REQUIRED` |
        | New key | The order is processed and the `202` response is stored |
        | Known key, same body, original request finished | The stored `202` response again; nothing is executed |
        | Known key, same body, original request still in progress | The stored `202` once the original finishes, or `409` with code `IDEMPOTENCY_KEY_IN_PROGRESS`; retry with the same key |
        | Known key, different body | `422`, code `IDEMPOTENCY_KEY_REUSED`; nothing is executed |

        Only accepted orders are stored. A request that fails (validation, insufficient funds,
        `503`) stores nothing, so a retry with the same key is evaluated again.

        Keys expire 72 hours after first use. After that, a request with the same key is
        treated as a new purchase.
      schema:
        type: string
        format: uuid
      example: 6f1c2a9e-1d0b-4b8e-9a51-3c2f0f1e7a42
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: |
        Preferred language of texts in the response (BCP 47), such as instrument names and
        `Problem.detail`. Falls back to English. Does not affect business logic.
      schema:
        type: string
      example: cs-CZ

  headers:
    RetryAfter:
      description: Number of seconds to wait before retrying the request.
      schema:
        type: integer
        minimum: 0
      example: 5

  responses:
    BadRequest:
      description: |
        The request is malformed or not valid. Do not retry it unchanged.
        Codes: `VALIDATION_FAILED`, `IDEMPOTENCY_KEY_REQUIRED`, `INVALID_CURSOR`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.miniinvest.example/problems/validation
            title: Request is not valid
            status: 400
            code: VALIDATION_FAILED
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            errors:
              - pointer: '#/quantity'
                detail: must be greater than or equal to 1
    Unauthorized:
      description: |
        The access token is missing, invalid or expired. Refresh the token and retry.
        Code: `UNAUTHORIZED`.
      headers:
        WWW-Authenticate:
          description: Authentication challenge for the Bearer scheme.
          schema:
            type: string
          example: Bearer error="invalid_token"
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.miniinvest.example/problems/unauthorized
            title: Authentication required
            status: 401
            code: UNAUTHORIZED
    NotFound:
      description: |
        The order does not exist or belongs to another user; the two cases are not
        distinguished. Code: `ORDER_NOT_FOUND`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.miniinvest.example/problems/order-not-found
            title: Order not found
            status: 404
            code: ORDER_NOT_FOUND
    Conflict:
      description: |
        A request with the same `Idempotency-Key` is still being processed. Wait and retry with
        the same key. Code: `IDEMPOTENCY_KEY_IN_PROGRESS`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.miniinvest.example/problems/idempotency-key-in-progress
            title: Request with this Idempotency-Key is in progress
            status: 409
            code: IDEMPOTENCY_KEY_IN_PROGRESS
    UnprocessableContent:
      description: |
        The request is valid but breaks a business rule. Show the error by `code`; retrying the
        same request does not help.
        Codes: `INSUFFICIENT_FUNDS`, `INSTRUMENT_NOT_AVAILABLE`, `QUANTITY_NOT_ALLOWED`,
        `IDEMPOTENCY_KEY_REUSED`.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          examples:
            insufficientFunds:
              summary: Not enough available cash
              value:
                type: https://api.miniinvest.example/problems/insufficient-funds
                title: Insufficient funds
                status: 422
                detail: Available cash is 1200.00 CZK, the order needs 2650.00 CZK.
                instance: /api/v1/orders
                code: INSUFFICIENT_FUNDS
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
            instrumentNotAvailable:
              summary: Instrument not offered in the user's market
              value:
                type: https://api.miniinvest.example/problems/instrument-not-available
                title: Instrument not available
                status: 422
                code: INSTRUMENT_NOT_AVAILABLE
            quantityNotAllowed:
              summary: Quantity below the minimum or not a multiple of the step
              value:
                type: https://api.miniinvest.example/problems/quantity-not-allowed
                title: Quantity not allowed
                status: 422
                detail: The quantity must be a multiple of 0.0001 and at least 0.0001.
                code: QUANTITY_NOT_ALLOWED
            idempotencyKeyReused:
              summary: Key already used for a different order
              value:
                type: https://api.miniinvest.example/problems/idempotency-key-reused
                title: Idempotency-Key reused
                status: 422
                code: IDEMPOTENCY_KEY_REUSED
    InternalError:
      description: |
        Unexpected server error. Requests with an `Idempotency-Key` can be retried with the same
        key. Code: `INTERNAL_ERROR`; `traceId` identifies the request in the logs.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.miniinvest.example/problems/internal-error
            title: Internal server error
            status: 500
            code: INTERNAL_ERROR
            traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    ServiceUnavailable:
      description: |
        A dependency is temporarily unavailable; nothing was stored. Wait for `Retry-After` and
        retry with the same `Idempotency-Key`. Code: `PRICE_UNAVAILABLE`.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://api.miniinvest.example/problems/price-unavailable
            title: Price unavailable
            status: 503
            code: PRICE_UNAVAILABLE

  schemas:
    Money:
      type: object
      description: An amount of money. Never a JSON number, never without a currency.
      required: [amount, currency]
      properties:
        amount:
          type: string
          description: |
            Decimal number as a string with `.` as the decimal separator. Amounts have as many
            decimal places as the currency (2 for CZK and EUR); unit prices may have more.
          pattern: '^-?(0|[1-9][0-9]*)(\.[0-9]+)?$'
          examples: ['2650.00']
        currency:
          $ref: '#/components/schemas/CurrencyCode'

    CurrencyCode:
      type: string
      description: ISO 4217 currency code.
      pattern: '^[A-Z]{3}$'
      examples: [CZK]

    MarketCode:
      type: string
      description: |
        Market of the account as an ISO 3166-1 alpha-2 country code. Extensible: new markets
        are added without a contract change, so clients must handle unknown values.
      pattern: '^[A-Z]{2}$'
      examples: [CZ]

    Quantity:
      type: string
      description: |
        Number of units as a decimal string with `.` as the decimal separator and at most 6
        decimal places, for example `'5'` or `'2.5'`. Never a JSON number. Quantities are compared
        numerically, so `'5'` and `'5.0'` are the same quantity.
      pattern: '^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$'
      examples: ['2.5']

    Isin:
      type: string
      description: International Securities Identification Number (ISO 6166).
      pattern: '^[A-Z]{2}[A-Z0-9]{9}[0-9]$'
      examples: [IE00B4L5Y983]

    OrderSide:
      type: string
      description: |
        Extensible. Known values: `BUY`. Clients must handle unknown values. The server
        currently accepts only `BUY` and rejects other values with `400`.
      pattern: '^[A-Z_]+$'
      examples: [BUY]

    OrderStatus:
      type: string
      description: |
        Extensible. Known values:

        - `PENDING`: accepted, waiting for execution,
        - `EXECUTED`: executed, the position is updated,
        - `REJECTED`: rejected, the reservation is released.

        Clients must show unknown values as still processing.
      pattern: '^[A-Z_]+$'
      examples: [PENDING]

    PlaceOrderRequest:
      type: object
      description: |
        What the user decided: which instrument and how much. The account, market, currency and
        price come from the server.
      required: [isin, side, quantity]
      properties:
        isin:
          $ref: '#/components/schemas/Isin'
        side:
          $ref: '#/components/schemas/OrderSide'
        quantity:
          $ref: '#/components/schemas/Quantity'
          description: |
            Number of units to buy, greater than 0. Must be at least the instrument's
            `minQuantity` and a multiple of its `quantityStep`, otherwise the order is rejected
            with `422` and code `QUANTITY_NOT_ALLOWED`.

    Order:
      type: object
      required:
        - orderId
        - side
        - isin
        - quantity
        - status
        - reservedAmount
        - executionPrice
        - rejectionCode
        - createdAt
        - updatedAt
      properties:
        orderId:
          type: string
          format: uuid
        side:
          $ref: '#/components/schemas/OrderSide'
        isin:
          $ref: '#/components/schemas/Isin'
        quantity:
          $ref: '#/components/schemas/Quantity'
        status:
          $ref: '#/components/schemas/OrderStatus'
        reservedAmount:
          $ref: '#/components/schemas/Money'
          description: |
            Cash reserved when the order was accepted: estimated price × quantity plus a buffer.
            Released after execution or rejection.
        executionPrice:
          description: Price per unit at execution; `null` until the order is executed.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        rejectionCode:
          type: [string, 'null']
          description: |
            Extensible machine-readable reason of the rejection, for example `MARKET_CLOSED`;
            `null` unless the order is rejected. Clients fall back to a generic message for
            unknown values.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    OrderPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
        nextCursor:
          type: [string, 'null']
          description: |
            Opaque cursor of the next page; `null` on the last page. Pass it back unchanged and
            never parse it.

    Cash:
      type: object
      required: [total, reserved, available]
      properties:
        total:
          $ref: '#/components/schemas/Money'
          description: Cash balance of the account.
        reserved:
          $ref: '#/components/schemas/Money'
          description: Cash held for pending orders.
        available:
          $ref: '#/components/schemas/Money'
          description: Cash that can be spent now (`total` − `reserved`).

    Position:
      type: object
      required: [isin, name, quantity, averagePrice, marketValue]
      properties:
        isin:
          $ref: '#/components/schemas/Isin'
        name:
          type: string
          description: Instrument name in the language from `Accept-Language`.
        quantity:
          $ref: '#/components/schemas/Quantity'
          description: Units held, greater than 0; may be fractional.
        averagePrice:
          $ref: '#/components/schemas/Money'
          description: Average purchase price per unit in the account currency.
        marketValue:
          description: |
            Current value (quantity × current price); `null` when the price is temporarily
            unavailable.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'

    Portfolio:
      type: object
      required: [market, currency, cash, positions]
      properties:
        market:
          $ref: '#/components/schemas/MarketCode'
        currency:
          $ref: '#/components/schemas/CurrencyCode'
          description: Currency of the account; all amounts in the portfolio use it.
        cash:
          $ref: '#/components/schemas/Cash'
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'

    Instrument:
      type: object
      required: [isin, name, minQuantity, quantityStep, price, priceTime]
      properties:
        isin:
          $ref: '#/components/schemas/Isin'
        name:
          type: string
          description: Instrument name in the language from `Accept-Language`.
        minQuantity:
          $ref: '#/components/schemas/Quantity'
          description: Smallest quantity that can be ordered.
        quantityStep:
          $ref: '#/components/schemas/Quantity'
          description: |
            Increment of the quantity. `'1'` means whole units only; for example `'0.0001'`
            allows fractional shares in steps of 0.0001.
        price:
          description: |
            Current price per unit in the market currency; `null` when the price is temporarily
            unavailable. Indicative only: the order is executed at the market price.
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        priceTime:
          type: [string, 'null']
          format: date-time
          description: Time of the price; `null` together with `price`.

    InstrumentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Instrument'

    ValidationError:
      type: object
      required: [pointer, detail]
      properties:
        pointer:
          type: string
          description: JSON Pointer to the invalid field as a URI fragment, for example `#/quantity`.
        detail:
          type: string

    Problem:
      type: object
      description: Error in the RFC 9457 format. Optional members are omitted when empty.
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri-reference
          description: URI identifying the problem type.
        title:
          type: string
          description: Short summary of the problem type; the same for every occurrence.
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
          description: Explanation of this occurrence for a human. Never parse it.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          pattern: '^[A-Z_]+$'
          description: |
            Stable machine-readable code. Extensible: clients map known codes to texts in the
            user's language and show a generic message by `status` for unknown codes.

            | Code | Status | Meaning |
            | --- | --- | --- |
            | `VALIDATION_FAILED` | 400 | Body or parameters are not valid; see `errors` |
            | `IDEMPOTENCY_KEY_REQUIRED` | 400 | `Idempotency-Key` is missing or not a UUID |
            | `INVALID_CURSOR` | 400 | The pagination cursor is not valid |
            | `UNAUTHORIZED` | 401 | Missing, invalid or expired access token |
            | `ORDER_NOT_FOUND` | 404 | The order does not exist or belongs to another user |
            | `IDEMPOTENCY_KEY_IN_PROGRESS` | 409 | A request with the same key is still processed |
            | `IDEMPOTENCY_KEY_REUSED` | 422 | The key was used for a different request |
            | `INSUFFICIENT_FUNDS` | 422 | Available cash does not cover the reservation |
            | `INSTRUMENT_NOT_AVAILABLE` | 422 | The instrument is not offered in the user's market |
            | `QUANTITY_NOT_ALLOWED` | 422 | The quantity is below the minimum or not a multiple of the step |
            | `INTERNAL_ERROR` | 500 | Unexpected server error |
            | `PRICE_UNAVAILABLE` | 503 | The price source does not respond |
        traceId:
          type: string
          description: Trace ID of the request for finding it in the logs.
        errors:
          type: array
          description: Invalid fields; present only with `VALIDATION_FAILED`.
          items:
            $ref: '#/components/schemas/ValidationError'
